name: diag (temporary)
on:
  push:
    branches: ['devin/**']
jobs:
  dry-run:
    runs-on: [self-hosted, linux, x64, gsg-frontend]
    timeout-minutes: 5
    env:
      APP_DIR: /home/deploy/apps/GlobalSimGroup
    steps:
      - uses: actions/checkout@v5
      - run: |
          cat > "$RUNNER_TEMP/compose.ci.yml" << EOF
          services:
            frontend:
              build:
                context: $GITHUB_WORKSPACE
          EOF
          docker compose -p globalsimgroup -f "$APP_DIR/docker-compose.yml" -f "$RUNNER_TEMP/compose.ci.yml" config frontend \
            | sed -E 's/((SECRET|TOKEN|PASSWORD|KEY)[A-Z_]*:).*/\1 <redacted>/I'
          ls "$GITHUB_WORKSPACE" | head -5; test -f "$GITHUB_WORKSPACE/.npmrc" && echo ".npmrc present"
