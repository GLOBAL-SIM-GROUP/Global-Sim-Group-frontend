name: diag (temporary)
on:
  push:
    branches: ['devin/**']
jobs:
  dry-run:
    runs-on: [self-hosted, linux, x64, gsg-frontend]
    timeout-minutes: 5
    env:
      APP_DIR: /home/deploy/apps/GlobalSimGroup
    steps:
      - run: |
          set +e
          cd "$APP_DIR/Global-Sim-Group-frontend"
          echo "--- status (would be discarded by reset --hard):"; git status --porcelain --untracked-files=no
          echo "--- branch: $(git rev-parse --abbrev-ref HEAD) head: $(git rev-parse --short HEAD)"
          git fetch --dry-run origin main; echo "fetch dry-run exit=$?"
          test -w .git/objects && echo ".git writable"
          find . -path ./node_modules -prune -o -path ./.git -prune -o ! -user deploy -print | head -20
          docker compose -f "$APP_DIR/docker-compose.yml" config --quiet; echo "compose config exit=$?"
          docker exec sim-frontend wget -qO /dev/null http://127.0.0.1:3000/; echo "healthcheck exit=$?"
          df -h / | tail -1
