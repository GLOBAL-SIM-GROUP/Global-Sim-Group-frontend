name: Deploy Frontend to VPS

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, tests & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & Type Check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # GSG-Frontend runner, installed on the production VPS (user `deploy`,
    # member of the `docker` group, no passwordless sudo).
    runs-on: [self-hosted, linux, x64, gsg-frontend]
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    env:
      # Compose project `globalsimgroup`: service `frontend` (container
      # `sim-frontend`, Traefik -> global-sim-group.com), built from the
      # git clone in ./Global-Sim-Group-frontend, with config from ./.env.
      APP_DIR: /home/deploy/apps/GlobalSimGroup
    steps:
      - name: Update source on the VPS
        run: |
          cd "$APP_DIR/Global-Sim-Group-frontend"
          git fetch --prune origin main
          # Deploy exactly the commit the `ci` job validated.
          git reset --hard "$GITHUB_SHA"
          git log --oneline -1

      - name: Build and restart frontend
        run: docker compose -f "$APP_DIR/docker-compose.yml" up -d --build frontend

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if docker exec sim-frontend wget -qO /dev/null http://127.0.0.1:3000/; then
              echo "Frontend is up"
              exit 0
            fi
            echo "Attempt $i/30: waiting for frontend..."
            sleep 2
          done
          echo "::error::Frontend did not answer on :3000 after 60s"
          docker compose -f "$APP_DIR/docker-compose.yml" logs --tail=100 frontend
          exit 1

      - name: Remove dangling images
        if: always()
        run: docker image prune -f
