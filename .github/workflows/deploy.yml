name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    # Ou avec des labels spécifiques pour cibler un runner particulier :
    # runs-on: [self-hosted, prod, linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy
        run: |
          echo "Deploying with self-hosted runner"
          # Ajoutez vos commandes de déploiement ici
