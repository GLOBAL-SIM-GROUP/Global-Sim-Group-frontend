name: Deploy Frontend to VPS

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, tests & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & Type Check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # GSG-Frontend runner, installed on the production VPS (user `deploy`,
    # member of the `docker` group, no passwordless sudo).
    runs-on: [self-hosted, linux, x64, gsg-frontend]
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    env:
      # Compose project `globalsimgroup`: service `frontend` (container
      # `sim-frontend`, Traefik -> global-sim-group.com), config from ./.env.
      APP_DIR: /home/deploy/apps/GlobalSimGroup
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build and restart frontend
        # The production compose builds from the clone in
        # $APP_DIR/Global-Sim-Group-frontend, which `deploy` can't update
        # (root-owned .git objects). Build from this job's checkout instead —
        # exactly the commit `ci` validated.
        run: |
          cat > "$RUNNER_TEMP/compose.ci.yml" << EOF
          services:
            frontend:
              build:
                context: $GITHUB_WORKSPACE
          EOF
          docker compose -p globalsimgroup \
            -f "$APP_DIR/docker-compose.yml" -f "$RUNNER_TEMP/compose.ci.yml" \
            up -d --build frontend

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if docker exec sim-frontend wget -qO /dev/null http://127.0.0.1:3000/; then
              echo "Frontend is up"
              exit 0
            fi
            echo "Attempt $i/30: waiting for frontend..."
            sleep 2
          done
          echo "::error::Frontend did not answer on :3000 after 60s"
          docker logs --tail=100 sim-frontend
          exit 1

      - name: Remove dangling images
        if: always()
        run: docker image prune -f
